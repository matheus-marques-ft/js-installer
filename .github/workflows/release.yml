name: Release

# Two jobs, two triggers, one file:
#   - `tag`   fires on every push to dev (skipping this workflow's own bot
#     commits) - computes the next vX.Y.Z from js-jumpserver's tags (the
#     canonical source), tags this repo, and propagates the same tag to all
#     9 siblings so the whole fork stays on one synchronized version.
#   - `image` fires whenever a v* tag lands on this repo - whether created
#     by the `tag` job above (this repo triggered the bump) or propagated
#     here from a sibling - so this repo's image gets rebuilt at that
#     version regardless of which repo's dev push actually triggered it.
on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

jobs:
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute next version (js-jumpserver is the canonical source)
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          LAST_TAG=$(gh api repos/matheus-marques-ft/js-jumpserver/tags --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v0.1.1"
          else
            VERSION=${LAST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_TAG"

      - name: Tag this repo and propagate to all siblings
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          OWNER="matheus-marques-ft"
          REPOS="js-jumpserver js-sdk-go js-koko js-lion js-luna js-lina js-chen js-docker-web js-installer js-client"
          THIS_REPO="$(basename "${{ github.repository }}")"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          for repo in ${REPOS}; do
            [ "${repo}" = "${THIS_REPO}" ] && continue
            SHA=$(gh api "repos/${OWNER}/${repo}/git/refs/heads/dev" --jq '.object.sha')
            gh api -X POST "repos/${OWNER}/${repo}/git/refs" \
              -f ref="refs/tags/${NEW_TAG}" -f sha="${SHA}" \
              && echo "  ${repo} -> ${NEW_TAG}" \
              || echo "  WARNING: could not tag ${repo} with ${NEW_TAG}"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          TAG=$(basename ${GITHUB_REF})
          REPO_NAME=$(basename ${GITHUB_REPOSITORY})
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-config.yml
          version: ${{ steps.get_version.outputs.TAG }}
          tag: ${{ steps.get_version.outputs.TAG }}
          disable-releaser: true

      - name: Create Upload Assets
        run: |
          NAME="${{ steps.get_version.outputs.REPO_NAME }}-${{ steps.get_version.outputs.TAG }}"
          mkdir -p build "$NAME"
          git archive --format tar HEAD | tar x -C "$NAME"
          sed -i "s@^export VERSION=.*@export VERSION=${{ steps.get_version.outputs.TAG }}@" "$NAME/static.env"
          tar -czf "build/${NAME}.tar.gz" "$NAME"
          cd build
          md5sum "${NAME}.tar.gz" > "${NAME}.tar.gz.md5"

      - name: Clean up any existing release for this tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq \
            ".[] | select(.tag_name == \"${TAG}\") | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/${id}" && echo "Deleted existing release ${id} for ${TAG}"
            done

      - name: Release Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ !endsWith(steps.get_version.outputs.TAG, '-stable') }}
          make_latest: ${{ endsWith(steps.get_version.outputs.TAG, '-stable') }}
          name: ${{ steps.get_version.outputs.TAG }}
          body: ${{ steps.create_release.outputs.body }}
          files: |
            build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

